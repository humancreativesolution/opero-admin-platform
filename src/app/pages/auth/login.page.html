<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-xl shadow-lg p-8 space-y-6">
    <div class="space-y-2 text-center">
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Opero Admin</h1>
      <p class="text-sm text-slate-500">Enter your credentials to access the platform</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()" class="space-y-4">
      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700" for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="admin@opero.io"
          class="flex h-10 w-full rounded-md border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 disabled:cursor-not-allowed disabled:opacity-50"
        />
      </div>

      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700" for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="flex h-10 w-full rounded-md border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 disabled:cursor-not-allowed disabled:opacity-50"
        />
      </div>

      @if (error) {
        <div class="p-3 rounded-md bg-red-50 border border-red-200 text-sm text-red-600">
          {{ error }}
        </div>
      }

      <button
        type="submit"
        hlmBtn
        [disabled]="loginForm.invalid || loading"
        class="w-full h-10 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center shadow-sm"
      >
        @if (loading) {
          <span class="animate-pulse">Signing in...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>
    </form>
  </div>
</div>
